name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # النسخة الثابتة تعمل بوضع التجربة داخل المتصفح، فنحذف مسارات الخادم قبل البناء
      - name: Remove server-only routes
        run: rm -rf "app/api" "app/cal" instrumentation.js
      - name: Build static site
        run: npx next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_DEMO: '1'
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
